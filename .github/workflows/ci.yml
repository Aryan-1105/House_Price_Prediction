name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files compile without errors
        run: |
          python -m py_compile app.py
          python -m py_compile src/house_price_prediction/utils.py
          python -m py_compile src/house_price_prediction/logger.py
          python -m py_compile src/house_price_prediction/exception.py
          python -m py_compile src/house_price_prediction/components/data_ingestion.py
          python -m py_compile src/house_price_prediction/components/data_transformation.py
          python -m py_compile src/house_price_prediction/components/model_trainer.py
          python -m py_compile src/house_price_prediction/pipelines/training_pipeline.py
          python -m py_compile src/house_price_prediction/pipelines/prediction_pipeline.py

      - name: Build Docker image
        run: docker build -t house-price-app .